<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YIA Admin Dashboard</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{--bg:#040b15;--panel:#09182a;--line:rgba(130,199,240,.18);--text:#eef7ff;--muted:#9ab0c4;--cyan:#31d8ff;--violet:#7655ff;--green:#64e8ae;--red:#ff8292;--yellow:#ffd36b}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 0,#123a5d 0,transparent 34%),var(--bg);color:var(--text);font:14px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,select{font:inherit}.wrap{max-width:1250px;margin:auto;padding:28px 20px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}.brand{display:flex;align-items:center;gap:12px}.mark{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--cyan),var(--violet));display:grid;place-items:center;font-weight:900;color:#03101b}.brand small{display:block;color:var(--muted)}.btn{border:0;border-radius:10px;padding:9px 13px;font-weight:800;cursor:pointer}.primary{color:#03101b;background:linear-gradient(100deg,var(--cyan),var(--violet))}.ghost{background:transparent;border:1px solid var(--line);color:#dbe8f3}.approve{background:rgba(100,232,174,.12);color:var(--green);border:1px solid rgba(100,232,174,.2)}.reject{background:rgba(255,130,146,.1);color:var(--red);border:1px solid rgba(255,130,146,.18)}.panel{background:rgba(7,20,36,.82);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 20px 70px rgba(0,0,0,.25)}.login{max-width:440px;margin:12vh auto}.kicker{letter-spacing:3px;color:var(--cyan);font-size:10px;font-weight:900}.login h1{font-size:38px;line-height:1;margin:12px 0}.muted{color:var(--muted)}label{display:block;font-size:12px;font-weight:750;margin:16px 0 7px}input{width:100%;padding:12px;border-radius:11px;border:1px solid var(--line);background:#04101e;color:var(--text)}.full{width:100%;margin-top:18px}.msg{min-height:22px;margin-top:12px}.error{color:var(--red)}.success{color:var(--green)}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.stat{padding:17px;border:1px solid var(--line);border-radius:17px;background:rgba(2,12,24,.45)}.stat small{display:block;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-size:9px}.stat b{font-size:25px;display:block;margin-top:3px}.section{margin-top:22px}.section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:12px}.section h2{margin:0;font-size:23px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:17px}table{width:100%;border-collapse:collapse;min-width:850px}th,td{text-align:left;padding:13px 14px;border-bottom:1px solid rgba(130,199,240,.1);vertical-align:top}th{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);background:rgba(3,13,25,.65)}tr:last-child td{border-bottom:0}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:10px;font-weight:850}.pending,.submitted{background:rgba(255,211,107,.12);color:var(--yellow)}.approved{background:rgba(100,232,174,.12);color:var(--green)}.rejected{background:rgba(255,130,146,.1);color:var(--red)}.actions{display:flex;gap:7px;flex-wrap:wrap}.empty{text-align:center;padding:28px;color:var(--muted)}.note{margin-top:8px;color:var(--muted);font-size:12px}.login-brand{margin-bottom:22px}@media(max-width:850px){.stats{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start}.section-head{align-items:flex-start;flex-direction:column;gap:10px}}@media(max-width:500px){.stats{grid-template-columns:1fr}}
</style>
</head>
<body><div id="app"></div>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from "./supabase-config.js";
const supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY), app=document.getElementById("app");
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const badge=s=>`<span class="badge ${esc(s||"pending")}">${esc(s||"pending")}</span>`;

function loginView(errorText=""){
 app.innerHTML=`<div class="wrap"><div class="panel login"><div class="brand login-brand"><div class="mark">YIA</div><div><strong>Young Inventors Academy</strong><small>Administration</small></div></div><div class="kicker">ADMIN ACCESS</div><h1>Admin Dashboard</h1><p class="muted">Sign in with the authorized YIA administrator account.</p><form id="login"><label>Email</label><input id="email" type="email" autocomplete="username" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required><button class="btn primary full">Sign in →</button><div id="msg" class="msg error">${esc(errorText)}</div></form></div></div>`;
 document.getElementById("login").onsubmit=async e=>{e.preventDefault();const m=document.getElementById("msg");m.textContent="Signing in…";m.className="msg";const {error}=await supabase.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error){m.textContent="Sign-in failed.";m.className="msg error"}else load()};
}

async function load(){
 const {data:{session}}=await supabase.auth.getSession();if(!session){loginView();return}
 app.innerHTML=`<div class="wrap"><div class="top"><div class="brand"><div class="mark">YIA</div><div><strong>Young Inventors Academy</strong><small>Admin dashboard</small></div></div><button id="logout" class="btn ghost">Sign out</button></div><div id="main"><div class="panel muted">Loading administration data…</div></div></div>`;
 logout.onclick=async()=>{await supabase.auth.signOut();loginView()};
 await refresh();
}

async function refresh(){
 const main=document.getElementById("main");
 const [membersRes,rewardsRes,projectsRes]=await Promise.all([
  supabase.from("members").select("id,member_id,full_name,email,country,city,field,membership_type,status,created_at").order("created_at",{ascending:false}),
  supabase.from("yic_reward_requests").select("id,member_id,activity_type,title,description,requested_amount,status,admin_note,created_at").order("created_at",{ascending:false}),
  supabase.from("projects").select("id,member_id,title,description,field,project_url,status,created_at,updated_at").order("created_at",{ascending:false})
 ]);
 if(membersRes.error){main.innerHTML=`<div class="panel error">Could not load members: ${esc(membersRes.error.message)}</div>`;return}
 const members=membersRes.data||[], rewards=rewardsRes.data||[], projects=projectsRes.data||[];
 const memberMap=Object.fromEntries(members.map(m=>[m.id,m]));
 const pendingMembers=members.filter(m=>m.status==="pending").length;
 const approvedMembers=members.filter(m=>m.status==="approved").length;
 const pendingRewards=rewards.filter(r=>r.status==="pending").length;
 const approvedRewards=rewards.filter(r=>r.status==="approved").length;
 const pendingProjects=projects.filter(p=>p.status==="submitted").length;

 main.innerHTML=`<div class="stats">
  <div class="stat"><small>Members</small><b>${members.length}</b></div>
  <div class="stat"><small>Pending Members</small><b>${pendingMembers}</b></div>
  <div class="stat"><small>Approved Members</small><b>${approvedMembers}</b></div>
  <div class="stat"><small>Pending Rewards</small><b>${pendingRewards}</b></div>
  <div class="stat"><small>Pending Projects</small><b>${pendingProjects}</b></div>
 </div>
 <section class="section"><div class="section-head"><div><div class="kicker">MEMBERSHIP</div><h2>Membership Applications</h2></div></div><div class="table-wrap">${memberTable(members)}</div></section>
 <section class="section"><div class="section-head"><div><div class="kicker">RESEARCH & DEVELOPMENT</div><h2>Projects</h2><div class="note">Review submitted projects before they become approved YIA activities.</div></div></div><div class="table-wrap">${projectTable(projects,memberMap)}</div></section>
 <section class="section"><div class="section-head"><div><div class="kicker">YIA CREDITS</div><h2>Reward Requests</h2></div></div><div class="table-wrap">${rewardTable(rewards,memberMap)}</div></section>
 <div id="msg" class="msg"></div>`;
}

function memberTable(rows){
 if(!rows.length)return `<div class="empty">No membership applications.</div>`;
 return `<table><thead><tr><th>Member</th><th>Location</th><th>Field</th><th>Membership</th><th>Status</th><th>Action</th></tr></thead><tbody>${rows.map(m=>`<tr><td><strong>${esc(m.full_name)}</strong><br><span class="muted">${esc(m.member_id)} · ${esc(m.email)}</span></td><td>${esc(m.city||"—")}, ${esc(m.country||"—")}</td><td>${esc(m.field||"—")}</td><td>${esc(m.membership_type||"—")}</td><td>${badge(m.status)}</td><td>${m.status==="pending"?`<div class="actions"><button class="btn approve" data-member="${m.id}" data-status="approved">Approve</button><button class="btn reject" data-member="${m.id}" data-status="rejected">Reject</button></div>`:"—"}</td></tr>`).join("")}</tbody></table>`;
}

function projectTable(rows,map){
 if(!rows.length)return `<div class="empty">No projects have been submitted.</div>`;
 return `<table><thead><tr><th>Project</th><th>Member</th><th>Field</th><th>Status</th><th>Submitted</th><th>Action</th></tr></thead><tbody>${rows.map(p=>{const m=map[p.member_id]||{};return `<tr><td><strong>${esc(p.title)}</strong><br><span class="muted">${esc(p.description||"No description")}</span>${p.project_url?`<br><a href="${esc(p.project_url)}" target="_blank" rel="noopener" style="color:var(--cyan)">Project link →</a>`:""}</td><td>${esc(m.full_name||"Unknown")}<br><span class="muted">${esc(m.member_id||"")}</span></td><td>${esc(p.field||"—")}</td><td>${badge(p.status)}</td><td>${new Date(p.created_at).toLocaleDateString()}</td><td>${p.status==="submitted"?`<div class="actions"><button class="btn approve" data-project="${p.id}" data-project-status="approved">Approve</button><button class="btn reject" data-project="${p.id}" data-project-status="rejected">Reject</button></div>`:"—"}</td></tr>`}).join("")}</tbody></table>`;
}

function rewardTable(rows,map){
 if(!rows.length)return `<div class="empty">No reward requests.</div>`;
 return `<table><thead><tr><th>Member</th><th>Activity</th><th>Request</th><th>Amount</th><th>Status</th><th>Action</th></tr></thead><tbody>${rows.map(r=>{const m=map[r.member_id]||{};return `<tr><td>${esc(m.full_name||"Unknown")}<br><span class="muted">${esc(m.member_id||"")}</span></td><td>${esc(r.activity_type)}</td><td><strong>${esc(r.title)}</strong><br><span class="muted">${esc(r.description||"")}</span></td><td><strong>${Number(r.requested_amount).toLocaleString()} YIC</strong></td><td>${badge(r.status)}</td><td>${r.status==="pending"?`<div class="actions"><button class="btn approve" data-reward="${r.id}">Approve +${Number(r.requested_amount).toLocaleString()} YIC</button><button class="btn reject" data-reward-reject="${r.id}">Reject</button></div>`:"—"}</td></tr>`}).join("")}</tbody></table>`;
}

document.addEventListener("click",async e=>{
 const b=e.target.closest("button");if(!b)return;
 const msg=document.getElementById("msg");
 if(b.dataset.member){
  const id=b.dataset.member,status=b.dataset.status;
  const {error}=await supabase.from("members").update({status}).eq("id",id);
  if(error){msg.textContent=error.message;msg.className="msg error"}else{msg.textContent=`Member ${status}.`;msg.className="msg success";await refresh()}
 }
 if(b.dataset.project){
  const {error}=await supabase.from("projects").update({status:b.dataset.projectStatus,updated_at:new Date().toISOString()}).eq("id",b.dataset.project);
  if(error){msg.textContent=error.message;msg.className="msg error"}else{msg.textContent=`Project ${b.dataset.projectStatus}.`;msg.className="msg success";await refresh()}
 }
 if(b.dataset.reward){
  const {error}=await supabase.rpc("approve_yic_reward",{p_request_id:b.dataset.reward});
  if(error){msg.textContent=error.message;msg.className="msg error"}else{msg.textContent="Reward approved and YIC added to the ledger.";msg.className="msg success";await refresh()}
 }
 if(b.dataset.rewardReject){
  const {error}=await supabase.from("yic_reward_requests").update({status:"rejected",reviewed_at:new Date().toISOString()}).eq("id",b.dataset.rewardReject).eq("status","pending");
  if(error){msg.textContent=error.message;msg.className="msg error"}else{msg.textContent="Reward request rejected.";msg.className="msg success";await refresh()}
 }
});
load();
</script>
</body>
</html>
