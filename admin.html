<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YIA Admin — Membership</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{--bg:#050d19;--panel:#091628;--line:rgba(130,199,240,.16);--text:#eef6ff;--muted:#8fa6bb;--cyan:#31d8ff;--violet:#7655ff;--green:#62e7ad;--red:#ff8292;--yellow:#ffd36b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#102c4b 0,transparent 35%),var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input{font:inherit}.wrap{max-width:1200px;margin:auto;padding:32px 22px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:34px}.mark{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--cyan),var(--violet));display:grid;place-items:center;font-weight:900;color:#03101d}.brand strong{font-size:18px}.brand small{display:block;color:var(--muted)}.panel{background:rgba(7,19,35,.78);border:1px solid var(--line);border-radius:22px;box-shadow:0 20px 70px rgba(0,0,0,.28);padding:28px}.login{max-width:460px;margin:10vh auto}.kicker{letter-spacing:3px;color:var(--cyan);font-size:11px;font-weight:800}.login h1{font-size:42px;line-height:1;margin:12px 0}.muted{color:var(--muted)}label{display:block;color:#cfe0ee;font-size:12px;font-weight:750;margin:18px 0 7px}input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:#04101e;color:var(--text);outline:none}input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(49,216,255,.08)}.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer}.primary{color:#03101b;background:linear-gradient(100deg,var(--cyan),var(--violet));width:100%;margin-top:20px}.danger{background:transparent;border:1px solid var(--line);color:#dbe8f3}.top{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:22px}.top h1{margin:5px 0;font-size:36px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:20px 0}.stat{padding:18px;border:1px solid var(--line);border-radius:16px;background:rgba(2,12,24,.5)}.stat b{display:block;font-size:28px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:16px}table{width:100%;border-collapse:collapse;min-width:920px}th,td{text-align:left;padding:14px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:11px;letter-spacing:.8px;color:#8fa6bb;text-transform:uppercase}td{font-size:13px}.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800}.pending{background:rgba(255,211,107,.12);color:var(--yellow)}.approved{background:rgba(98,231,173,.12);color:var(--green)}.rejected{background:rgba(255,130,146,.12);color:var(--red)}select{background:#071525;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:8px}.msg{min-height:22px;margin-top:12px;color:var(--muted)}.error{color:var(--red)}.success{color:var(--green)}.empty{padding:35px;text-align:center;color:var(--muted)}@media(max-width:700px){.stats{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.top h1{font-size:30px}}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from "./supabase-config.js";

const app = document.getElementById("app");
const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

function loginView(message=""){
  app.innerHTML = `<div class="wrap"><div class="panel login">
    <div class="brand"><div class="mark">YIA</div><div><strong>Young Inventors Academy</strong><small>Secure membership administration</small></div></div>
    <div class="kicker">ADMIN ACCESS</div><h1>Member dashboard</h1>
    <p class="muted">Sign in with the YIA administrator account.</p>
    <form id="login-form">
      <label>Email</label><input id="email" type="email" autocomplete="username" required>
      <label>Password</label><input id="password" type="password" autocomplete="current-password" required>
      <button class="btn primary" type="submit">Sign in →</button>
      <div id="msg" class="msg ${message?'error':''}">${message}</div>
    </form>
  </div></div>`;
  document.getElementById("login-form").addEventListener("submit", async e=>{
    e.preventDefault();
    const msg=document.getElementById("msg"); msg.textContent="Signing in…"; msg.className="msg";
    const {error}=await supabase.auth.signInWithPassword({
      email:document.getElementById("email").value.trim(),
      password:document.getElementById("password").value
    });
    if(error){msg.textContent="Sign-in failed. Check your email and password.";msg.className="msg error";return}
    loadDashboard();
  });
}

function esc(v){
  return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
function badge(s){const x=esc(s||"pending");return `<span class="badge ${x}">${x}</span>`}

async function loadDashboard(){
  const {data:{session}}=await supabase.auth.getSession();
  if(!session){loginView();return}
  app.innerHTML=`<div class="wrap">
    <div class="top"><div><div class="brand" style="margin:0"><div class="mark">YIA</div><div><strong>YIA Admin</strong><small>Membership dashboard</small></div></div><h1>Applications</h1><p class="muted">Review and manage membership applications.</p></div><button id="logout" class="btn danger">Sign out</button></div>
    <div class="stats"><div class="stat"><span class="muted">Total</span><b id="total">—</b></div><div class="stat"><span class="muted">Pending</span><b id="pending">—</b></div><div class="stat"><span class="muted">Approved</span><b id="approved">—</b></div></div>
    <div id="msg" class="msg"></div>
    <div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Location</th><th>Field</th><th>Membership</th><th>Skills</th><th>Created</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div>
  </div>`;
  document.getElementById("logout").onclick=async()=>{await supabase.auth.signOut();loginView()};
  await refresh();
}

async function refresh(){
  const msg=document.getElementById("msg");
  const {data,error}=await supabase.from("members").select("id,created_at,full_name,email,country,city,field,skills,membership_type,status").order("created_at",{ascending:false});
  if(error){msg.textContent="Could not load applications. Check the Admin RLS policies.";msg.className="msg error";return}
  document.getElementById("total").textContent=data.length;
  document.getElementById("pending").textContent=data.filter(x=>x.status==="pending").length;
  document.getElementById("approved").textContent=data.filter(x=>x.status==="approved").length;
  const rows=document.getElementById("rows");
  if(!data.length){rows.innerHTML=`<tr><td colspan="8" class="empty">No applications yet.</td></tr>`;return}
  rows.innerHTML=data.map(x=>`<tr>
    <td><strong>${esc(x.full_name)}</strong></td>
    <td>${esc(x.email)}</td>
    <td>${esc([x.city,x.country].filter(Boolean).join(", "))}</td>
    <td>${esc(x.field)}</td>
    <td>${esc(x.membership_type)}</td>
    <td>${esc(x.skills)}</td>
    <td>${new Date(x.created_at).toLocaleString()}</td>
    <td><select data-id="${esc(x.id)}" class="status-select"><option value="pending" ${x.status==="pending"?"selected":""}>Pending</option><option value="approved" ${x.status==="approved"?"selected":""}>Approved</option><option value="rejected" ${x.status==="rejected"?"selected":""}>Rejected</option></select><div style="margin-top:5px">${badge(x.status)}</div></td>
  </tr>`).join("");
  rows.querySelectorAll(".status-select").forEach(sel=>sel.addEventListener("change",async()=>{
    const id=sel.dataset.id, status=sel.value;
    sel.disabled=true;
    const {error}=await supabase.from("members").update({status}).eq("id",id);
    sel.disabled=false;
    if(error){msg.textContent="Status update failed. Check the Admin UPDATE policy.";msg.className="msg error";return}
    msg.textContent="Status updated.";msg.className="msg success";await refresh();
  }));
}

supabase.auth.onAuthStateChange((_event, session)=>{ if(session) loadDashboard(); });
loadDashboard();
</script>
</body>
</html>
