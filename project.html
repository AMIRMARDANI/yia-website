<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project | Young Inventors Academy</title>
<meta name="description" content="Explore an approved project from the Young Inventors Academy.">
<style>
:root{--bg:#020916;--panel:#061626;--line:#183a52;--text:#f5f8ff;--muted:#9bb4d0;--cyan:#4cd2ff;--green:#62f4b0}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0%,rgba(34,132,184,.16),transparent 35%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:inherit}.wrap{max-width:1100px;margin:0 auto;padding:28px 24px 80px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:46px}.brand{display:flex;align-items:center;gap:12px}.mark{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#35c8ff,#7467ff);font-weight:900;color:#06101c}.brand strong{display:block;font-size:18px}.brand small{display:block;color:var(--muted);margin-top:3px}.back{border:1px solid var(--line);border-radius:999px;padding:10px 16px;text-decoration:none;color:#c9def3}.back:hover{border-color:var(--cyan);color:#fff}.card{border:1px solid var(--line);border-radius:28px;background:linear-gradient(145deg,rgba(8,31,48,.96),rgba(3,15,27,.96));padding:42px;box-shadow:0 24px 70px rgba(0,0,0,.24)}.topline{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:26px}.kicker{font-size:12px;letter-spacing:3px;color:var(--cyan);font-weight:800;text-transform:uppercase}.status{border:1px solid rgba(98,244,176,.28);background:rgba(98,244,176,.07);color:var(--green);border-radius:999px;padding:9px 14px;font-size:12px;letter-spacing:1.4px;font-weight:800;text-transform:uppercase}h1{font-size:clamp(38px,6vw,68px);line-height:1.03;margin:0 0 20px;letter-spacing:-2px}.description{font-size:19px;line-height:1.75;color:#b8cee4;max-width:820px}.meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:36px 0}.meta-box{border:1px solid var(--line);border-radius:18px;padding:18px;background:rgba(2,12,22,.45)}.meta-label{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:#6f91ad;margin-bottom:8px}.meta-value{font-size:16px;color:#e8f2fc}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}.btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:13px 18px;text-decoration:none;border:1px solid var(--line);font-weight:800}.btn.primary{background:linear-gradient(135deg,#36c9ff,#6572ff);color:#06101c;border:0}.btn.secondary{color:#d7e7f7}.btn.secondary:hover{border-color:var(--cyan)}.error{text-align:center;padding:70px 20px;color:#ff8d9b}.error a{display:inline-block;margin-top:18px}footer{text-align:center;color:#637f99;margin-top:28px;font-size:13px}@media(max-width:700px){.wrap{padding:20px 16px 60px}.top{margin-bottom:28px}.card{padding:26px 20px;border-radius:22px}.topline{align-items:flex-start}.meta{grid-template-columns:1fr}h1{letter-spacing:-1px}}

.puzzle-section{margin-top:48px;padding-top:36px;border-top:1px solid var(--line)}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:22px}
.section-head h2{font-size:30px;margin:0 0 7px}.section-head p{margin:0;color:var(--muted)}
.puzzle-board{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;padding:14px;border-radius:28px;background:linear-gradient(135deg,rgba(14,46,68,.65),rgba(2,11,21,.85));border:1px solid rgba(76,210,255,.16);overflow:hidden}
.puzzle-board:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(76,210,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(76,210,255,.035) 1px,transparent 1px);background-size:28px 28px;pointer-events:none}
.puzzle-tile{position:relative;min-height:190px;border:1px solid rgba(118,197,247,.2);background:linear-gradient(145deg,rgba(8,30,48,.98),rgba(2,15,28,.98));border-radius:22px;padding:18px;text-align:left;color:var(--text);cursor:pointer;overflow:hidden;transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease}
.puzzle-tile:hover{transform:translateY(-6px) rotate(.4deg);border-color:rgba(76,210,255,.58);box-shadow:0 18px 35px rgba(0,0,0,.3),0 0 25px rgba(76,210,255,.08)}
.puzzle-tile:after{content:"";position:absolute;right:-25px;bottom:-25px;width:85px;height:85px;border-radius:50%;border:1px solid rgba(76,210,255,.14)}
.tile-icon{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:rgba(76,210,255,.1);border:1px solid rgba(76,210,255,.18);font-size:22px;margin-bottom:22px}
.tile-type{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--cyan);font-weight:850}
.tile-title{font-size:18px;font-weight:850;margin:8px 0 8px;line-height:1.2}
.tile-desc{font-size:12px;color:#9eb3c9;line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tile-footer{position:absolute;left:18px;right:18px;bottom:15px;display:flex;justify-content:space-between;gap:8px;color:#7fa3be;font-size:11px}
.empty-puzzle{grid-column:1/-1;padding:60px 20px;text-align:center;color:var(--muted);border:1px dashed rgba(118,197,247,.22);border-radius:22px}
@media(max-width:900px){.puzzle-board{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:650px){.puzzle-board{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:10px}.puzzle-tile{min-height:170px;padding:15px}.tile-footer{left:15px;right:15px}.section-head{align-items:flex-start;flex-direction:column}}

</style>
</head>
<body>
<div class="wrap">
<header class="top"><div class="brand"><div class="mark">YIA</div><div><strong>Young Inventors Academy</strong><small>Project showcase</small></div></div><a class="back" href="index.html#projects">← All Projects</a></header>
<main id="app" class="card">Loading project…</main>
<footer>© 2026 Young Inventors Academy (YIA) · Science · Innovation · Humanity</footer>
</div>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from "./supabase-config.js";
const app=document.getElementById("app");
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const projectId=new URLSearchParams(location.search).get("id");
function errorBox(msg){app.innerHTML=`<div class="error"><h2>Project not found</h2><p>${esc(msg)}</p><a class="back" href="index.html#projects">← Back to Projects</a></div>`}
async function load(){
 if(!projectId)return errorBox("This project link is missing a project ID.");
 try{
  const supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
  const {data,error}=await supabase.rpc("get_public_projects");
  if(error)throw error;
  const p=(data||[]).find(row=>String(row.id)===String(projectId));
  if(!p)return errorBox("This project is not available publicly.");

  const field=String(p.field||"Other").trim()||"Other";
  const lead=p.member_id||"YIA Member";
  const leadHref=`member.html?id=${encodeURIComponent(lead)}`;

  app.innerHTML=`
   <div class="topline"><div class="kicker">${esc(field)}</div><div class="status">Approved</div></div>
   <h1>${esc(p.title)}</h1>
   <p class="description">${esc(p.description||"Innovative work developed within the YIA community.")}</p>
   <div class="meta">
    <div class="meta-box"><div class="meta-label">Project Lead</div><div class="meta-value"><a href="${leadHref}">${esc(lead)} ↗</a></div></div>
    <div class="meta-box"><div class="meta-label">Organization</div><div class="meta-value">Young Inventors Academy</div></div>
   </div>
   <div class="actions">
    <a class="btn secondary" href="${leadHref}">View Project Lead ↗</a>
    ${p.project_url?`<a class="btn primary" href="${esc(p.project_url)}" target="_blank" rel="noopener noreferrer">Visit External Project ↗</a>`:""}
   </div>

   <section class="puzzle-section">
    <div class="section-head">
      <div><h2>Project Puzzle</h2><p>Every contribution adds a new piece to the project.</p></div>
    </div>
    <div id="puzzle-board" class="puzzle-board"><div class="empty-puzzle">Building the project puzzle…</div></div>
   </section>
  `;

  await loadResources(supabase, p);
 }catch(e){console.error(e);errorBox("We could not load this project right now. Please try again later.")}
}

function resourceIcon(type){
 const icons={image:"🖼️",article:"📄",code:"💻",document:"📚",link:"🔗"};
 return icons[type]||"🧩";
}

async function loadResources(supabase,p){
 const board=document.getElementById("puzzle-board");
 const {data,error}=await supabase.rpc("get_public_project_resources",{p_project_id:p.id});
 if(error){console.error(error);board.innerHTML=`<div class="empty-puzzle">Project resources are temporarily unavailable.</div>`;return;}
 const rows=data||[];
 if(!rows.length){board.innerHTML=`<div class="empty-puzzle"><div style="font-size:36px;margin-bottom:12px">🧩</div>No pieces have been added yet.<br>The first approved contribution will become the first piece.</div>`;return;}

 board.innerHTML=rows.map((r,i)=>`
  <button class="puzzle-tile" data-resource-id="${esc(r.id)}" type="button">
   <div class="tile-icon">${resourceIcon(r.resource_type)}</div>
   <div class="tile-type">Piece ${String(i+1).padStart(2,"0")} · ${esc(r.resource_type)}</div>
   <div class="tile-title">${esc(r.title)}</div>
   <div class="tile-desc">${esc(r.description||"Open this contribution to explore it.")}</div>
   <div class="tile-footer"><span>${new Date(r.created_at).toLocaleDateString()}</span><span>Open ↗</span></div>
  </button>
 `).join("");

 board.querySelectorAll(".puzzle-tile").forEach(tile=>{
   tile.addEventListener("click",()=>location.href=`resource.html?id=${encodeURIComponent(tile.dataset.resourceId)}`);
 });
}
load();
</script>
</body></html>
