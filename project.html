<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project | Young Inventors Academy</title>
<meta name="description" content="Explore an approved project from the Young Inventors Academy.">
<style>
:root{--bg:#020916;--panel:#061626;--line:#183a52;--text:#f5f8ff;--muted:#9bb4d0;--cyan:#4cd2ff;--green:#62f4b0}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0%,rgba(34,132,184,.16),transparent 35%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:inherit}.wrap{max-width:1100px;margin:0 auto;padding:28px 24px 80px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:46px}.brand{display:flex;align-items:center;gap:12px}.mark{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#35c8ff,#7467ff);font-weight:900;color:#06101c}.brand strong{display:block;font-size:18px}.brand small{display:block;color:var(--muted);margin-top:3px}.back{border:1px solid var(--line);border-radius:999px;padding:10px 16px;text-decoration:none;color:#c9def3}.back:hover{border-color:var(--cyan);color:#fff}.card{border:1px solid var(--line);border-radius:28px;background:linear-gradient(145deg,rgba(8,31,48,.96),rgba(3,15,27,.96));padding:42px;box-shadow:0 24px 70px rgba(0,0,0,.24)}.topline{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:26px}.kicker{font-size:12px;letter-spacing:3px;color:var(--cyan);font-weight:800;text-transform:uppercase}.status{border:1px solid rgba(98,244,176,.28);background:rgba(98,244,176,.07);color:var(--green);border-radius:999px;padding:9px 14px;font-size:12px;letter-spacing:1.4px;font-weight:800;text-transform:uppercase}h1{font-size:clamp(38px,6vw,68px);line-height:1.03;margin:0 0 20px;letter-spacing:-2px}.description{font-size:19px;line-height:1.75;color:#b8cee4;max-width:820px}.meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:36px 0}.meta-box{border:1px solid var(--line);border-radius:18px;padding:18px;background:rgba(2,12,22,.45)}.meta-label{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:#6f91ad;margin-bottom:8px}.meta-value{font-size:16px;color:#e8f2fc}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}.btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:13px 18px;text-decoration:none;border:1px solid var(--line);font-weight:800}.btn.primary{background:linear-gradient(135deg,#36c9ff,#6572ff);color:#06101c;border:0}.btn.secondary{color:#d7e7f7}.btn.secondary:hover{border-color:var(--cyan)}.error{text-align:center;padding:70px 20px;color:#ff8d9b}.error a{display:inline-block;margin-top:18px}footer{text-align:center;color:#637f99;margin-top:28px;font-size:13px}@media(max-width:700px){.wrap{padding:20px 16px 60px}.top{margin-bottom:28px}.card{padding:26px 20px;border-radius:22px}.topline{align-items:flex-start}.meta{grid-template-columns:1fr}h1{letter-spacing:-1px}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><div class="brand"><div class="mark">YIA</div><div><strong>Young Inventors Academy</strong><small>Project showcase</small></div></div><a class="back" href="index.html#projects">← All Projects</a></header>
<main id="app" class="card">Loading project…</main>
<footer>© 2026 Young Inventors Academy (YIA) · Science · Innovation · Humanity</footer>
</div>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from "./supabase-config.js";
const app=document.getElementById("app");
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const projectId=new URLSearchParams(location.search).get("id");
function errorBox(msg){app.innerHTML=`<div class="error"><h2>Project not found</h2><p>${esc(msg)}</p><a class="back" href="index.html#projects">← Back to Projects</a></div>`}
async function load(){
 if(!projectId)return errorBox("This project link is missing a project ID.");
 try{
  const supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
  const {data,error}=await supabase.rpc("get_public_projects");
  if(error)throw error;
  const p=(data||[]).find(row=>String(row.id)===String(projectId));
  if(!p)return errorBox("This project is not available publicly.");
  const field=String(p.field||"Other").trim()||"Other";
  const lead=p.member_id||"YIA Member";
  const leadHref=`member.html?id=${encodeURIComponent(lead)}`;
  app.innerHTML=`<div class="topline"><div class="kicker">${esc(field)}</div><div class="status">Approved</div></div><h1>${esc(p.title)}</h1><p class="description">${esc(p.description||"Innovative work developed within the YIA community.")}</p><div class="meta"><div class="meta-box"><div class="meta-label">Project Lead</div><div class="meta-value"><a href="${leadHref}">${esc(lead)} ↗</a></div></div><div class="meta-box"><div class="meta-label">Organization</div><div class="meta-value">Young Inventors Academy</div></div></div><div class="actions"><a class="btn secondary" href="${leadHref}">View Project Lead ↗</a>${p.project_url?`<a class="btn primary" href="${esc(p.project_url)}" target="_blank" rel="noopener noreferrer">Visit External Project ↗</a>`:""}</div>`;
 }catch(e){console.error(e);errorBox("We could not load this project right now. Please try again later.")}
}
load();
</script>
</body></html>
