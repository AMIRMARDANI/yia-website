<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YIA Admin — Project Members</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{--bg:#050d19;--panel:#091628;--line:rgba(130,199,240,.16);--text:#eef6ff;--muted:#8fa6bb;--cyan:#31d8ff;--violet:#7655ff;--green:#62e7ad;--red:#ff8292;--yellow:#ffd36b}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 80% 0,#102c4b 0,transparent 35%),var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,select{font:inherit}.wrap{max-width:1200px;margin:auto;padding:32px 22px}
.panel{background:rgba(7,19,35,.78);border:1px solid var(--line);border-radius:22px;box-shadow:0 20px 70px rgba(0,0,0,.28);padding:28px}
.brand{display:flex;align-items:center;gap:12px}.mark{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--cyan),var(--violet));display:grid;place-items:center;font-weight:900;color:#03101b}.brand strong{font-size:18px}.brand small{display:block;color:var(--muted)}
.kicker{letter-spacing:3px;color:var(--cyan);font-size:11px;font-weight:800}
h1{font-size:38px;line-height:1;margin:10px 0}h2{font-size:22px;margin:0 0 6px}.muted{color:var(--muted)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:25px}
.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{color:#03101b;background:linear-gradient(100deg,var(--cyan),var(--violet))}.ghost{background:#071525;color:#dbe8f3;border:1px solid var(--line)}.danger{background:transparent;border:1px solid var(--line);color:#dbe8f3}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:20px 0}.stat{padding:18px;border:1px solid var(--line);border-radius:16px;background:rgba(2,12,24,.5)}.stat span{color:var(--muted);font-size:12px}.stat b{display:block;font-size:28px;margin-top:4px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.toolbar input,.toolbar select{border:1px solid var(--line);border-radius:12px;background:#04101e;color:var(--text);padding:12px 13px;outline:none}.toolbar input{flex:1;min-width:260px}
.grid{display:grid;gap:15px}.card{border:1px solid var(--line);border-radius:19px;background:rgba(2,12,24,.56);padding:22px}.card:hover{border-color:rgba(49,216,255,.35)}
.card-head{display:flex;justify-content:space-between;gap:15px}.project{color:var(--cyan);font-size:10px;letter-spacing:2px;text-transform:uppercase;font-weight:900}.name{font-size:21px;font-weight:850;margin:6px 0}.meta{color:var(--muted);font-size:12px}
.badge{display:inline-block;padding:6px 9px;border-radius:999px;font-size:10px;font-weight:850;letter-spacing:1px;text-transform:uppercase}.requested{background:rgba(255,211,107,.12);color:var(--yellow)}.approved,.active{background:rgba(98,231,173,.12);color:var(--green)}.rejected{background:rgba(255,130,146,.12);color:var(--red)}
.actions{display:flex;align-items:end;gap:10px;flex-wrap:wrap;margin-top:19px;padding-top:17px;border-top:1px solid rgba(130,199,240,.1)}label{display:flex;flex-direction:column;gap:6px;color:#cfe0ee;font-size:11px;font-weight:800}label select{min-width:190px;border:1px solid var(--line);border-radius:11px;background:#04101e;color:var(--text);padding:11px 12px}
.msg{min-height:22px;margin:10px 0;color:var(--muted)}.error{color:var(--red)}.success{color:var(--green)}
.empty{text-align:center;padding:48px;border:1px dashed var(--line);border-radius:18px;color:var(--muted)}
@media(max-width:700px){.stats{grid-template-columns:1fr}.top{flex-direction:column}.card-head{display:block}.card-head>.badge{margin-top:12px}}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from "./supabase-config.js";
const app=document.getElementById("app");
const supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);

function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function login(){
 app.innerHTML=`<div class="wrap"><div class="panel" style="max-width:460px;margin:10vh auto">
 <div class="brand"><div class="mark">YIA</div><div><strong>YIA Admin</strong><small>Project member management</small></div></div>
 <div class="kicker" style="margin-top:28px">ADMIN ACCESS</div><h1>Project Members</h1>
 <p class="muted">Sign in with the YIA administrator account.</p>
 <form id="login"><label>Email<input id="email" type="email" required autocomplete="username"></label>
 <label>Password<input id="password" type="password" required autocomplete="current-password"></label>
 <button class="btn primary" style="width:100%;margin-top:20px">Sign in →</button><div id="m" class="msg"></div></form>
 </div></div>`;
 document.getElementById("login").onsubmit=async e=>{e.preventDefault();const m=document.getElementById("m");m.textContent="Signing in…";const {error}=await supabase.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error){m.textContent="Sign-in failed.";m.className="msg error";return}load();};
}
let rows=[];
async function load(){
 const {data:{session}}=await supabase.auth.getSession();if(!session){login();return}
 app.innerHTML=`<div class="wrap"><div class="top"><div><div class="brand"><div class="mark">YIA</div><div><strong>YIA Admin</strong><small>Project member management</small></div></div><h1 style="margin-top:24px">Project Members</h1><p class="muted">Review requests to join YIA projects and assign project roles.</p></div><button id="logout" class="btn danger">Sign out</button></div>
 <div class="stats"><div class="stat"><span>Total Memberships</span><b id="total">—</b></div><div class="stat"><span>Pending Requests</span><b id="pending">—</b></div><div class="stat"><span>Active Members</span><b id="active">—</b></div></div>
 <div id="msg" class="msg"></div><div class="toolbar"><input id="search" placeholder="Search project, member or role…"><select id="filter"><option value="">All statuses</option><option value="requested">Requested</option><option value="approved">Approved</option><option value="active">Active</option><option value="rejected">Rejected</option><option value="completed">Completed</option><option value="left">Left</option></select><button id="refresh" class="btn ghost">Refresh</button></div>
 <section id="grid" class="grid"><div class="empty">Loading…</div></section></div>`;
 logout.onclick=async()=>{await supabase.auth.signOut();login()};refresh.onclick=loadData;search.oninput=render;filter.onchange=render;await loadData();
}
async function loadData(){
 const msg=document.getElementById("msg");msg.textContent="Loading…";msg.className="msg";
 const {data,error}=await supabase.from("project_members").select("id,project_id,member_id,role,status,joined_at,updated_at").order("joined_at",{ascending:false});
 if(error){msg.textContent="Could not load project memberships.";msg.className="msg error";return}
 const pids=[...new Set((data||[]).map(x=>x.project_id))],mids=[...new Set((data||[]).map(x=>x.member_id))];
 const [pr,me]=await Promise.all([
  pids.length?supabase.from("projects").select("id,title").in("id",pids):Promise.resolve({data:[]}),
  mids.length?supabase.from("members").select("id,full_name,member_id").in("id",mids):Promise.resolve({data:[]})
 ]);
 const pm={},mm={};(pr.data||[]).forEach(x=>pm[x.id]=x);(me.data||[]).forEach(x=>mm[x.id]=x);
 rows=(data||[]).map(x=>({...x,projectTitle:pm[x.project_id]?.title||"YIA Project",memberName:mm[x.member_id]?.full_name||"YIA Member",memberCode:mm[x.member_id]?.member_id||"—"}));
 render();msg.textContent="";
}
function render(){
 const q=(document.getElementById("search")?.value||"").toLowerCase().trim(),f=document.getElementById("filter")?.value||"";
 const filtered=rows.filter(x=>(!f||x.status===f)&&(!q||[x.projectTitle,x.memberName,x.memberCode,x.role,x.status].join(" ").toLowerCase().includes(q)));
 total.textContent=rows.length;pending.textContent=rows.filter(x=>x.status==="requested").length;active.textContent=rows.filter(x=>["approved","active"].includes(x.status)).length;
 const grid=document.getElementById("grid");
 if(!filtered.length){grid.innerHTML='<div class="empty">No membership records match your search.</div>';return}
 grid.innerHTML=filtered.map(x=>`<article class="card"><div class="card-head"><div><div class="project">${esc(x.projectTitle)}</div><div class="name">${esc(x.memberName)}</div><div class="meta">${esc(x.memberCode)} · Requested ${new Date(x.joined_at).toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"})}</div></div><span class="badge ${esc(x.status)}">${esc(x.status)}</span></div>
 <div class="actions"><label>Role<select data-role="${x.id}" ${x.role==="Project Lead" ? 'disabled aria-describedby="lead-role-note"' : ""}>${x.role==="Project Lead" ? '<option value="Project Lead" selected>Project Lead (manage on Project Leads page)</option>' : ""}<option>Contributor</option><option>Researcher</option><option>Designer</option><option>AI Research</option><option>Electronics</option><option>Mission Design</option><option>Other</option></select>${x.role==="Project Lead" ? '<span id="lead-role-note" class="meta">Change the lead only on the Project Leads page.</span>' : ""}</label>
 <button class="btn primary" data-action="approve" data-id="${x.id}">Approve</button><button class="btn ghost" data-action="reject" data-id="${x.id}">Reject</button></div></article>`).join("");
 filtered.forEach(x=>{const s=document.querySelector(`[data-role="${CSS.escape(x.id)}"]`);if(s)s.value=x.role||"Contributor"});
 grid.querySelectorAll("[data-action]").forEach(b=>b.onclick=()=>update(b.dataset.id,b.dataset.action));
}
async function update(id,action){
 const role=document.querySelector(`[data-role="${CSS.escape(id)}"]`)?.value||"Contributor";
 const status=action==="approve"?"active":"rejected";
 if(!confirm(`${action==="approve"?"Approve":"Reject"} this project membership as "${role}"?`))return;
 const msg=document.getElementById("msg");msg.textContent="Saving…";msg.className="msg";
 const {error}=await supabase.rpc("admin_update_project_member",{p_membership_id:id,p_status:status,p_role:role});
 if(error){console.error(error);msg.textContent=error.message||"Could not update membership.";msg.className="msg error";return}
 msg.textContent=action==="approve"?"Membership approved.":"Membership rejected.";msg.className="msg success";await loadData();
}
supabase.auth.onAuthStateChange((_e,s)=>{if(s)load()});load();
</script>
</body></html>
