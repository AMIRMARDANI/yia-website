<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YIA Admin — Project Leads</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{--bg:#050d19;--panel:#091628;--line:rgba(130,199,240,.16);--text:#eef6ff;--muted:#8fa6bb;--cyan:#31d8ff;--violet:#7655ff;--green:#62e7ad;--red:#ff8292;--yellow:#ffd36b}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 80% 0,#102c4b 0,transparent 35%),var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,select{font:inherit}.wrap{max-width:1200px;margin:auto;padding:32px 22px}
.panel{background:rgba(7,19,35,.78);border:1px solid var(--line);border-radius:22px;box-shadow:0 20px 70px rgba(0,0,0,.28);padding:28px}
.brand{display:flex;align-items:center;gap:12px}.mark{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--cyan),var(--violet));display:grid;place-items:center;font-weight:900;color:#03101b}.brand strong{font-size:18px}.brand small{display:block;color:var(--muted)}
.kicker{letter-spacing:3px;color:var(--cyan);font-size:11px;font-weight:800}
h1{font-size:38px;line-height:1;margin:10px 0}h2{font-size:22px;margin:0 0 6px}.muted{color:var(--muted)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:25px}
.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{color:#03101b;background:linear-gradient(100deg,var(--cyan),var(--violet))}.ghost{background:#071525;color:#dbe8f3;border:1px solid var(--line)}.danger{background:transparent;border:1px solid var(--line);color:#dbe8f3}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:20px 0}.stat{padding:18px;border:1px solid var(--line);border-radius:16px;background:rgba(2,12,24,.5)}.stat span{color:var(--muted);font-size:12px}.stat b{display:block;font-size:28px;margin-top:4px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.toolbar input,.toolbar select{border:1px solid var(--line);border-radius:12px;background:#04101e;color:var(--text);padding:12px 13px;outline:none}.toolbar input{flex:1;min-width:260px}
.grid{display:grid;gap:15px}.card{border:1px solid var(--line);border-radius:19px;background:rgba(2,12,24,.56);padding:22px}.card:hover{border-color:rgba(49,216,255,.35)}
.project{color:var(--cyan);font-size:10px;letter-spacing:2px;text-transform:uppercase;font-weight:900}.title{font-size:21px;font-weight:850;margin:6px 0}.meta{color:var(--muted);font-size:12px}
.current{margin-top:17px;padding:14px;border:1px solid rgba(98,231,173,.18);background:rgba(98,231,173,.06);border-radius:14px}.current-label{font-size:10px;letter-spacing:1.5px;color:var(--green);font-weight:900}.current-name{font-weight:850;margin-top:4px}.current-meta{font-size:11px;color:var(--muted)}
.assign{margin-top:17px;padding-top:17px;border-top:1px solid rgba(130,199,240,.1);display:flex;gap:10px;align-items:end;flex-wrap:wrap}
label{display:flex;flex-direction:column;gap:6px;color:#cfe0ee;font-size:11px;font-weight:800;flex:1;min-width:260px}
select{border:1px solid var(--line);border-radius:11px;background:#04101e;color:var(--text);padding:11px 12px;outline:none}
.msg{min-height:22px;margin:10px 0;color:var(--muted)}.error{color:var(--red)}.success{color:var(--green)}
.empty{text-align:center;padding:48px;border:1px dashed var(--line);border-radius:18px;color:var(--muted)}
@media(max-width:700px){.stats{grid-template-columns:1fr}.top{flex-direction:column}}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from "./supabase-config.js";
const app=document.getElementById("app");
const supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);

function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}

function login(){
 app.innerHTML=`<div class="wrap"><div class="panel" style="max-width:460px;margin:10vh auto">
 <div class="brand"><div class="mark">YIA</div><div><strong>YIA Admin</strong><small>Project lead management</small></div></div>
 <div class="kicker" style="margin-top:28px">ADMIN ACCESS</div><h1>Project Leads</h1>
 <p class="muted">Assign an approved project member as the lead of a YIA project.</p>
 <form id="login"><label>Email<input id="email" type="email" required autocomplete="username"></label>
 <label>Password<input id="password" type="password" required autocomplete="current-password"></label>
 <button class="btn primary" style="width:100%;margin-top:20px">Sign in →</button><div id="m" class="msg"></div></form>
 </div></div>`;
 document.getElementById("login").onsubmit=async e=>{
   e.preventDefault();
   const m=document.getElementById("m");m.textContent="Signing in…";m.className="msg";
   const {error}=await supabase.auth.signInWithPassword({email:email.value.trim(),password:password.value});
   if(error){m.textContent="Sign-in failed. Check your email and password.";m.className="msg error";return}
   load();
 };
}

let projects=[], candidates={};

async function load(){
 const {data:{session}}=await supabase.auth.getSession();
 if(!session){login();return}

 app.innerHTML=`<div class="wrap">
 <div class="top">
   <div>
     <div class="brand"><div class="mark">YIA</div><div><strong>YIA Admin</strong><small>Project lead management</small></div></div>
     <h1 style="margin-top:24px">Project Leads</h1>
     <p class="muted">Assign an active member of each project as its Project Lead.</p>
   </div>
   <button id="logout" class="btn danger">Sign out</button>
 </div>
 <div class="stats">
   <div class="stat"><span>Total Projects</span><b id="total">—</b></div>
   <div class="stat"><span>Projects With Lead</span><b id="withLead">—</b></div>
   <div class="stat"><span>Projects Without Lead</span><b id="withoutLead">—</b></div>
 </div>
 <div id="msg" class="msg"></div>
 <div class="toolbar"><input id="search" placeholder="Search projects…"><button id="refresh" class="btn ghost">Refresh</button></div>
 <section id="grid" class="grid"><div class="empty">Loading…</div></section>
 </div>`;

 document.getElementById("logout").onclick=async()=>{await supabase.auth.signOut();login()};
 document.getElementById("refresh").onclick=loadData;
 document.getElementById("search").oninput=render;
 await loadData();
}

async function loadData(){
 const msg=document.getElementById("msg");msg.textContent="Loading…";msg.className="msg";

 const {data:projectsData,error}=await supabase
   .from("projects")
   .select("id,title,field,status,project_lead_member_id,created_at")
   .order("created_at",{ascending:false});

 if(error){console.error(error);msg.textContent="Could not load projects.";msg.className="msg error";return}
 projects=projectsData||[];

 const ids=projects.map(p=>p.id);
 candidates={};

 if(ids.length){
   const {data:members,error:memberError}=await supabase
     .from("project_members")
     .select("project_id,member_id,role,status,joined_at")
     .in("project_id",ids)
     .in("status",["approved","active"])
     .order("joined_at",{ascending:true});

   if(memberError){console.error(memberError);msg.textContent="Could not load project members.";msg.className="msg error";return}

   const memberIds=[...new Set((members||[]).map(x=>x.member_id))];
   let memberMap={};
   if(memberIds.length){
     const {data:memberRows}=await supabase.from("members").select("id,full_name,member_id").in("id",memberIds);
     (memberRows||[]).forEach(m=>memberMap[m.id]=m);
   }

   (members||[]).forEach(x=>{
     if(!candidates[x.project_id]) candidates[x.project_id]=[];
     candidates[x.project_id].push({...x,full_name:memberMap[x.member_id]?.full_name||"YIA Member",yia_id:memberMap[x.member_id]?.member_id||"—"});
   });
 }

 render();msg.textContent="";
}

function render(){
 const q=(document.getElementById("search")?.value||"").trim().toLowerCase();
 const filtered=projects.filter(p=>!q||[p.title,p.field,p.status].join(" ").toLowerCase().includes(q));
 const grid=document.getElementById("grid");

 document.getElementById("total").textContent=projects.length;
 document.getElementById("withLead").textContent=projects.filter(p=>p.project_lead_member_id).length;
 document.getElementById("withoutLead").textContent=projects.filter(p=>!p.project_lead_member_id).length;

 if(!filtered.length){grid.innerHTML='<div class="empty">No projects match your search.</div>';return}

 grid.innerHTML=filtered.map(p=>{
   const list=candidates[p.id]||[];
   const lead=list.find(m=>m.member_id===p.project_lead_member_id);
   const options=list.length
     ? list.map(m=>`<option value="${esc(m.member_id)}">${esc(m.full_name)} — ${esc(m.yia_id)} · ${esc(m.role||"Contributor")}</option>`).join("")
     : `<option value="">No active project members</option>`;

   return `<article class="card">
     <div class="project">${esc(p.field||"Open / multidisciplinary")}</div>
     <div class="title">${esc(p.title)}</div>
     <div class="meta">${esc(p.status||"draft")} · ${new Date(p.created_at).toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"})}</div>

     ${lead ? `<div class="current">
       <div class="current-label">CURRENT PROJECT LEAD</div>
       <div class="current-name">${esc(lead.full_name)}</div>
       <div class="current-meta">${esc(lead.yia_id)} · ${esc(lead.role||"Project Lead")}</div>
     </div>` : `<div class="current" style="border-color:rgba(255,211,107,.16);background:rgba(255,211,107,.04)">
       <div class="current-label" style="color:#ffd36b">NO PROJECT LEAD</div>
       <div class="current-meta">Select an active project member below.</div>
     </div>`}

     <div class="assign">
       <label>Assign Project Lead
         <select data-project="${p.id}" ${list.length?"":"disabled"}>
           <option value="">Select an active member…</option>
           ${options}
         </select>
       </label>
       <button class="btn primary assign-btn" data-project="${p.id}" ${list.length?"":"disabled"}>Assign Lead</button>
     </div>
   </article>`;
 }).join("");

 filtered.forEach(p=>{
   const select=document.querySelector(`[data-project="${CSS.escape(p.id)}"]`);
   if(select && p.project_lead_member_id) select.value=p.project_lead_member_id;
 });
 grid.querySelectorAll(".assign-btn").forEach(b=>b.onclick=()=>assignLead(b.dataset.project));
}

async function assignLead(projectId){
 const select=document.querySelector(`[data-project="${CSS.escape(projectId)}"]`);
 const memberId=select?.value;
 const msg=document.getElementById("msg");

 if(!memberId){
   msg.textContent="Select an active project member first.";
   msg.className="msg error";
   return;
 }

 const project=projects.find(p=>p.id===projectId);
 const member=(candidates[projectId]||[]).find(m=>m.member_id===memberId);
 if(!member)return;

 if(!confirm(`Assign ${member.full_name} as Project Lead for "${project.title}"?`))return;

 msg.textContent="Assigning Project Lead…";msg.className="msg";

 const {error}=await supabase.rpc("admin_assign_project_lead",{
   p_project_id:projectId,
   p_member_id:memberId
 });

 if(error){
   console.error(error);
   msg.textContent=error.message||"Could not assign Project Lead.";
   msg.className="msg error";
   return;
 }

 msg.textContent=`${member.full_name} is now the Project Lead.`;
 msg.className="msg success";
 await loadData();
}

supabase.auth.onAuthStateChange((_event,session)=>{if(session)load()});
load();
</script>
</body>
</html>
