<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YIA Member Dashboard</title>
<meta name="description" content="Young Inventors Academy member dashboard">
<meta name="robots" content="noindex,nofollow">
<style>
:root{--bg:#040b15;--panel:#09182a;--line:rgba(130,199,240,.18);--text:#eef7ff;--muted:#9ab0c4;--cyan:#31d8ff;--violet:#7655ff;--green:#64e8ae;--red:#ff8292;--yellow:#ffd36b}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 75% 0,#123a5d 0,transparent 34%),var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,textarea,select{font:inherit}.wrap{max-width:1100px;margin:auto;padding:30px 20px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:28px}.brand{display:flex;align-items:center;gap:12px}.mark{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--cyan),var(--violet));display:grid;place-items:center;font-weight:900;color:#03101b}.brand small{display:block;color:var(--muted)}.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:800;cursor:pointer}.danger{background:transparent;border:1px solid var(--line);color:#dbe8f3}.primary{color:#03101b;background:linear-gradient(100deg,var(--cyan),var(--violet))}.panel{background:rgba(7,20,36,.82);border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:0 22px 80px rgba(0,0,0,.3)}.login{max-width:460px;margin:10vh auto}.kicker{letter-spacing:3px;color:var(--cyan);font-size:11px;font-weight:850}.login h1{font-size:42px;line-height:1;margin:12px 0}.muted{color:var(--muted)}label{display:block;color:#cfe0ee;font-size:12px;font-weight:750;margin:17px 0 7px}input,textarea,select{width:100%;padding:12px 13px;border-radius:12px;border:1px solid var(--line);background:#04101e;color:var(--text);outline:none}textarea{min-height:120px;resize:vertical}input:focus,textarea:focus,select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(49,216,255,.08)}.primary.full{width:100%;margin-top:18px}.msg{min-height:22px;margin-top:12px;color:var(--muted)}.error{color:var(--red)}.success{color:var(--green)}.hero{display:grid;grid-template-columns:1.5fr .8fr;gap:16px}.hero-card{padding:26px;border:1px solid var(--line);border-radius:22px;background:rgba(2,12,24,.45)}.hero h1{font-size:clamp(34px,6vw,58px);line-height:1;margin:10px 0;letter-spacing:-2px}.id{display:inline-block;padding:7px 11px;border-radius:999px;background:rgba(49,216,255,.08);border:1px solid var(--line);color:#bfeeff;font-weight:800;font-size:12px}.status{margin-top:13px;color:var(--green);font-size:12px;font-weight:800}.balance{display:flex;flex-direction:column;justify-content:center}.balance .label{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted)}.balance .value{font-size:38px;font-weight:900;margin-top:5px;background:linear-gradient(100deg,var(--cyan),#a9b5ff,var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}.stat{padding:18px;border:1px solid var(--line);border-radius:17px;background:rgba(2,12,24,.45)}.stat .label{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted)}.stat b{display:block;margin-top:4px;font-size:22px}.section{margin-top:26px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:14px}.section h2{margin:0;font-size:25px}.project-list{display:grid;gap:12px}.project{padding:18px;border:1px solid var(--line);border-radius:17px;background:rgba(2,12,24,.45)}.project-top{display:flex;justify-content:space-between;gap:15px}.project h3{margin:0 0 5px}.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:10px;font-weight:850}.draft{background:rgba(143,166,187,.12);color:#b8c7d4}.submitted{background:rgba(255,211,107,.12);color:var(--yellow)}.approved{background:rgba(98,231,173,.12);color:var(--green)}.rejected{background:rgba(255,130,146,.12);color:var(--red)}.empty{padding:30px;text-align:center;border:1px dashed var(--line);border-radius:17px;color:var(--muted)}.form-panel{display:none;margin-top:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.foot{margin-top:25px;color:var(--muted);font-size:12px}@media(max-width:760px){.hero,.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.top,.section-head,.project-top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body><div id="app"></div>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from "./supabase-config.js";
const supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY), app=document.getElementById("app");
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const badge=s=>{const x=esc(s||"draft");return `<span class="badge ${x}">${x}</span>`};

function loginView(message=""){
 app.innerHTML=`<div class="wrap"><div class="panel login"><div class="brand"><div class="mark">YIA</div><div><strong>Young Inventors Academy</strong><small>Member portal</small></div></div><div class="kicker">MEMBER ACCESS</div><h1>Member Dashboard</h1><p class="muted">Sign in to manage your YIA profile and projects.</p><form id="login-form"><label>Email</label><input id="email" type="email" autocomplete="username" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required><button class="btn primary full" type="submit">Sign in →</button><div id="msg" class="msg ${message?'error':''}">${esc(message)}</div></form></div></div>`;
 document.getElementById("login-form").addEventListener("submit",async e=>{
  e.preventDefault();const msg=document.getElementById("msg");msg.textContent="Signing in…";msg.className="msg";
  const {error}=await supabase.auth.signInWithPassword({email:document.getElementById("email").value.trim(),password:document.getElementById("password").value});
  if(error){msg.textContent="Sign-in failed. Check your email and password.";msg.className="msg error";return} loadDashboard();
 });
}
async function loadDashboard(){
 const {data:{session}}=await supabase.auth.getSession();if(!session){loginView();return}
 app.innerHTML=`<div class="wrap"><div class="top"><div class="brand"><div class="mark">YIA</div><div><strong>Young Inventors Academy</strong><small>Member dashboard</small></div></div><button id="logout" class="btn danger">Sign out</button></div><div id="content"><div class="panel muted">Loading your dashboard…</div></div></div>`;
 document.getElementById("logout").onclick=async()=>{await supabase.auth.signOut();loginView()};
 const {data:members,error:memberError}=await supabase.rpc("get_my_member");
 if(memberError||!members?.length){document.getElementById("content").innerHTML=`<div class="panel"><div class="error"><strong>Member account not linked.</strong><br>Please contact the YIA administrator.</div></div>`;return}
 const member=members[0];
 const [{data:yicData,error:yicError},{data:projects,error:projectError}]=await Promise.all([
  supabase.rpc("get_public_member_yic",{p_member_id:member.member_id}),
  supabase.from("projects").select("id,title,description,field,project_url,status,created_at,updated_at").eq("member_id",member.id).order("created_at",{ascending:false})
 ]);
 const balance=(!yicError&&typeof yicData==="number")?yicData:0, projectList=projectError?[]:(projects||[]);
 document.getElementById("content").innerHTML=`<div class="hero"><div class="hero-card"><div class="kicker">YIA MEMBER</div><h1>${esc(member.full_name)}</h1><div class="id">${esc(member.member_id)}</div><div class="status">● ${esc(member.status).toUpperCase()} MEMBER</div></div><div class="hero-card balance"><div class="label">YIA Credits</div><div class="value">🪙 ${balance.toLocaleString()} YIC</div><div class="muted">Current reward balance</div></div></div>
 <div class="stats"><div class="stat"><div class="label">Field</div><b>${esc(member.field||"—")}</b></div><div class="stat"><div class="label">Membership</div><b>${esc(member.membership_type||"—")}</b></div><div class="stat"><div class="label">Projects</div><b>${projectList.length}</b></div></div>
 <section class="section"><div class="section-head"><div><h2>My Projects</h2><div class="muted">Projects connected to your YIA membership.</div></div><button id="show-form" class="btn primary">+ Add New Project</button></div>
 <div id="form-panel" class="panel form-panel"><div class="kicker">NEW PROJECT</div><form id="project-form"><div class="grid"><div><label>Project title</label><input id="p-title" required maxlength="160" placeholder="e.g. AI Medical Assistant"></div><div><label>Field</label><select id="p-field"><option>Electronics</option><option>Software</option><option>Artificial Intelligence</option><option>Medical</option><option>Robotics</option><option>Automotive</option><option>Energy</option><option>Other</option></select></div></div><label>Description</label><textarea id="p-description" placeholder="Describe the project, your contribution, and its purpose."></textarea><label>Project URL <span class="muted">(optional)</span></label><input id="p-url" type="url" placeholder="https://..."><button class="btn primary" type="submit">Submit Project</button><div id="project-msg" class="msg"></div></form></div>
 <div id="projects" class="project-list" style="margin-top:14px"></div></section><div class="foot">Your dashboard only displays information connected to your authenticated YIA member account.</div>`;
 renderProjects(projectList);
 document.getElementById("show-form").onclick=()=>{const p=document.getElementById("form-panel");p.style.display=p.style.display==="block"?"none":"block";if(p.style.display==="block")document.getElementById("p-title").focus()};
 document.getElementById("project-form").addEventListener("submit",async e=>{
  e.preventDefault();const msg=document.getElementById("project-msg");msg.textContent="Submitting project…";msg.className="msg";
  const payload={member_id:member.id,title:document.getElementById("p-title").value.trim(),description:document.getElementById("p-description").value.trim()||null,field:document.getElementById("p-field").value,project_url:document.getElementById("p-url").value.trim()||null,status:"submitted"};
  const {error}=await supabase.from("projects").insert(payload);
  if(error){msg.textContent=error.message||"Project submission failed.";msg.className="msg error";return}
  msg.textContent="Project submitted successfully.";msg.className="msg success";document.getElementById("project-form").reset();
  const {data:newProjects}=await supabase.from("projects").select("id,title,description,field,project_url,status,created_at,updated_at").eq("member_id",member.id).order("created_at",{ascending:false});renderProjects(newProjects||[]);
 });
}
function renderProjects(projects){
 const box=document.getElementById("projects");if(!projects.length){box.innerHTML=`<div class="empty">No projects yet.<br>Use <strong>+ Add New Project</strong> to submit your first project.</div>`;return}
 box.innerHTML=projects.map(p=>`<article class="project"><div class="project-top"><div><h3>${esc(p.title)}</h3><div class="muted">${esc(p.field||"Other")} · ${new Date(p.created_at).toLocaleDateString()}</div></div>${badge(p.status)}</div>${p.description?`<p>${esc(p.description)}</p>`:""}${p.project_url?`<a href="${esc(p.project_url)}" target="_blank" rel="noopener noreferrer" style="color:var(--cyan)">Open project →</a>`:""}</article>`).join("");
}
supabase.auth.onAuthStateChange((_event,session)=>{if(session)loadDashboard()});loadDashboard();
</script>
</body>
</html>
