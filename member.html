<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YIA Member Profile</title>
<meta name="description" content="Young Inventors Academy member profile">
<meta name="robots" content="noindex">
<style>
:root{--bg:#040b15;--panel:#09182a;--line:rgba(130,199,240,.18);--text:#eef7ff;--muted:#9ab0c4;--cyan:#31d8ff;--violet:#7655ff;--green:#64e8ae}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 70% 5%,#123a5d 0,transparent 34%),var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.wrap{max-width:900px;margin:auto;padding:42px 20px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.brand{display:flex;align-items:center;gap:12px}.mark{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--cyan),var(--violet));display:grid;place-items:center;font-weight:900;color:#03101b}.brand small{display:block;color:var(--muted)}.card{background:rgba(7,20,36,.82);border:1px solid var(--line);border-radius:28px;padding:34px;box-shadow:0 24px 90px rgba(0,0,0,.35)}.kicker{letter-spacing:3px;color:var(--cyan);font-size:11px;font-weight:850}.hero{display:flex;justify-content:space-between;gap:30px;align-items:flex-start}.hero h1{font-size:clamp(38px,7vw,66px);line-height:1;margin:12px 0 10px;letter-spacing:-3px}.grad{background:linear-gradient(100deg,var(--cyan),#a9b5ff,var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}.id{display:inline-block;padding:8px 12px;border-radius:999px;background:rgba(49,216,255,.08);border:1px solid var(--line);color:#bfeeff;font-weight:800;font-size:12px}.active{color:var(--green);font-size:12px;font-weight:800;margin-top:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:34px}.item{padding:16px;border:1px solid var(--line);border-radius:16px;background:rgba(2,12,24,.45)}.label{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted)}.value{margin-top:4px;font-weight:700}.skills{margin-top:26px}.pill{display:inline-block;margin:7px 7px 0 0;padding:7px 10px;border-radius:999px;background:#0b2138;color:#cde3f2;border:1px solid var(--line);font-size:12px}.foot{margin-top:26px;color:var(--muted);font-size:12px}.error{text-align:center;padding:70px 20px;color:#ff9aa9}@media(max-width:620px){.hero{display:block}.grid{grid-template-columns:1fr}.card{padding:25px}}
</style>
</head>
<body>
<div class="wrap"><div class="top"><div class="brand"><div class="mark">YIA</div><div><strong>Young Inventors Academy</strong><small>Member profile</small></div></div></div><main id="app" class="card">Loading profile…</main></div>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from "./supabase-config.js";
const app=document.getElementById("app");
const supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const id=new URLSearchParams(location.search).get("id");
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
if(!id){app.innerHTML='<div class="error">Member ID is missing.</div>'}
else{
 const {data,error}=await supabase.rpc("get_public_member",{p_member_id:id});
 if(error || !data || !data.length){app.innerHTML='<div class="error"><strong>Member not found.</strong><br>This profile may not exist or may not be publicly active.</div>'}
 else{
  const m=data[0];
  const skills=(m.skills||"").split(",").map(x=>x.trim()).filter(Boolean);
  app.innerHTML=`<div class="hero"><div><div class="kicker">YIA VERIFIED MEMBER</div><h1>${esc(m.full_name)}</h1><div class="id">${esc(m.member_id)}</div><div class="active">● ACTIVE MEMBER</div></div></div>
  <div class="grid">
   <div class="item"><div class="label">Field</div><div class="value">${esc(m.field)}</div></div>
   <div class="item"><div class="label">Membership</div><div class="value">${esc(m.membership_type)}</div></div>
   <div class="item"><div class="label">Location</div><div class="value">${esc([m.city,m.country].filter(Boolean).join(", ")||"—")}</div></div>
   <div class="item"><div class="label">Member since</div><div class="value">${new Date(m.created_at).toLocaleDateString(undefined,{year:"numeric",month:"long"})}</div></div>
  </div>
  ${skills.length?`<div class="skills"><div class="label">Skills</div>${skills.map(x=>`<span class="pill">${esc(x)}</span>`).join("")}</div>`:""}
  <div class="foot">This profile displays public membership information only. Private contact information is not shown.</div>`;
 }
}
</script>
</body>
</html>
