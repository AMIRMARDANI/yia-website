<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YIA — Project Lead Dashboard</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{--bg:#050d19;--panel:#091628;--line:rgba(130,199,240,.16);--text:#eef6ff;--muted:#8fa6bb;--cyan:#31d8ff;--violet:#7655ff;--green:#62e7ad;--red:#ff8292;--yellow:#ffd36b}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 80% 0,#102c4b 0,transparent 35%),var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,select{font:inherit}.wrap{max-width:1200px;margin:auto;padding:32px 22px}
.panel{background:rgba(7,19,35,.78);border:1px solid var(--line);border-radius:22px;box-shadow:0 20px 70px rgba(0,0,0,.28);padding:28px}
.brand{display:flex;align-items:center;gap:12px}.mark{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--cyan),var(--violet));display:grid;place-items:center;font-weight:900;color:#03101b}.brand strong{font-size:18px}.brand small{display:block;color:var(--muted)}
.kicker{letter-spacing:3px;color:var(--cyan);font-size:11px;font-weight:800}
h1{font-size:38px;line-height:1;margin:10px 0}h2{font-size:25px;margin:0 0 6px}.muted{color:var(--muted)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:24px}
.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{color:#03101b;background:linear-gradient(100deg,var(--cyan),var(--violet))}.ghost{background:#071525;color:#dbe8f3;border:1px solid var(--line)}.danger{background:transparent;border:1px solid var(--line);color:#dbe8f3}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:20px 0}.stat{padding:18px;border:1px solid var(--line);border-radius:16px;background:rgba(2,12,24,.5)}.stat span{color:var(--muted);font-size:12px}.stat b{display:block;font-size:28px;margin-top:4px}
.grid{display:grid;gap:15px}.project-card{padding:22px;border:1px solid var(--line);border-radius:19px;background:rgba(2,12,24,.56)}.project-card+.project-card{margin-top:18px}
.project-name{font-size:22px;font-weight:850}.project-meta{font-size:12px;color:var(--muted);margin-top:4px}
.section-title{display:flex;justify-content:space-between;align-items:end;gap:15px;margin:24px 0 12px;padding-top:20px;border-top:1px solid rgba(130,199,240,.1)}
.member{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:13px;border:1px solid rgba(118,197,247,.12);border-radius:14px;background:rgba(3,13,25,.5);margin-top:9px}
.member-main{display:flex;gap:11px;align-items:center}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#35d2ff,#7550ff);color:#03101b;font-weight:900}.member-name{font-size:13px;font-weight:850}.member-meta{font-size:11px;color:var(--muted)}
.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.actions select{border:1px solid var(--line);border-radius:10px;background:#04101e;color:var(--text);padding:9px 10px}
.badge{display:inline-block;padding:5px 8px;border-radius:999px;font-size:9px;font-weight:850;letter-spacing:1px;text-transform:uppercase}.requested{background:rgba(255,211,107,.12);color:var(--yellow)}.approved,.active{background:rgba(98,231,173,.12);color:var(--green)}.rejected{background:rgba(255,130,146,.12);color:var(--red)}
.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}.msg{min-height:22px;margin:8px 0;color:var(--muted)}.error{color:var(--red)}.success{color:var(--green)}
@media(max-width:700px){.stats{grid-template-columns:1fr}.top{flex-direction:column}.member{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from "./supabase-config.js";
const supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const app=document.getElementById("app");

function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}

function login(){
 app.innerHTML=`<div class="wrap"><div class="panel" style="max-width:460px;margin:10vh auto">
 <div class="brand"><div class="mark">YIA</div><div><strong>Young Inventors Academy</strong><small>Project Lead Management</small></div></div>
 <div class="kicker" style="margin-top:28px">MEMBER ACCESS</div><h1>Project Lead Dashboard</h1>
 <p class="muted">Sign in with your approved YIA member account.</p>
 <form id="login"><div style="margin-top:18px"><label style="display:block;color:#cfe0ee;font-size:11px;font-weight:800">Email</label><input id="email" type="email" required autocomplete="username" style="width:100%;margin-top:6px;padding:12px;border-radius:11px;border:1px solid var(--line);background:#04101e;color:var(--text)"></div>
 <div style="margin-top:14px"><label style="display:block;color:#cfe0ee;font-size:11px;font-weight:800">Password</label><input id="password" type="password" required autocomplete="current-password" style="width:100%;margin-top:6px;padding:12px;border-radius:11px;border:1px solid var(--line);background:#04101e;color:var(--text)"></div>
 <button class="btn primary" style="width:100%;margin-top:20px">Sign in →</button><div id="loginMsg" class="msg"></div></form>
 </div></div>`;
 document.getElementById("login").onsubmit=async e=>{
   e.preventDefault();const m=document.getElementById("loginMsg");m.textContent="Signing in…";
   const {error}=await supabase.auth.signInWithPassword({email:document.getElementById("email").value.trim(),password:document.getElementById("password").value});
   if(error){m.textContent="Sign-in failed. Check your email and password.";m.className="msg error";return}
   load();
 };
}

async function load(){
 const {data:{session}}=await supabase.auth.getSession();
 if(!session){login();return}
 app.innerHTML=`<div class="wrap">
 <div class="top"><div><div class="brand"><div class="mark">YIA</div><div><strong>YIA</strong><small>Project Lead Dashboard</small></div></div><h1 style="margin-top:24px">Project Management</h1><p class="muted">Manage only the YIA projects where you are the assigned Project Lead.</p></div><button id="logout" class="btn danger">Sign out</button></div>
 <div class="stats"><div class="stat"><span>My Lead Projects</span><b id="projectCount">—</b></div><div class="stat"><span>Pending Join Requests</span><b id="requestCount">—</b></div><div class="stat"><span>Active Team Members</span><b id="activeCount">—</b></div></div>
 <div id="msg" class="msg"></div><section id="projects" class="grid"><div class="empty">Loading projects…</div></section>
 </div>`;
 document.getElementById("logout").onclick=async()=>{await supabase.auth.signOut();login()};
 await loadProjects();
}

async function loadProjects(){
 const msg=document.getElementById("msg");
 const {data:projects,error}=await supabase.rpc("get_my_lead_projects");
 if(error){msg.textContent=error.message||"Could not load your lead projects.";msg.className="msg error";return}

 const list=projects||[];
 document.getElementById("projectCount").textContent=list.length;
 if(!list.length){
   document.getElementById("projects").innerHTML='<div class="empty">You are not currently assigned as Project Lead of any project.</div>';
   return;
 }

 const allTeams=[];
 for(const project of list){
   const {data:team,error:teamError}=await supabase.rpc("get_my_lead_team",{p_project_id:project.project_id});
   allTeams.push({project,team:team||[],error:teamError});
 }
 document.getElementById("requestCount").textContent=allTeams.reduce((n,x)=>n+x.team.filter(m=>m.status==="requested").length,0);
 document.getElementById("activeCount").textContent=allTeams.reduce((n,x)=>n+x.team.filter(m=>["approved","active"].includes(m.status)).length,0);

 document.getElementById("projects").innerHTML=allTeams.map(({project,team,error})=>{
   const requests=team.filter(m=>m.status==="requested");
   const members=team.filter(m=>m.status!=="requested");
   return `<article class="project-card">
     <div class="kicker">${esc(project.field||"YIA PROJECT")}</div>
     <div class="project-name">${esc(project.title)}</div>
     <div class="project-meta">${esc(project.status)} · ${new Date(project.created_at).toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"})}</div>
     ${error?`<div class="msg error">${esc(error.message)}</div>`:""}
     <div class="section-title"><div><div class="kicker">MEMBERSHIP REQUESTS</div><strong>${requests.length} pending</strong></div></div>
     ${requests.length?requests.map(memberCard).join(""):'<div class="empty">No pending membership requests.</div>'}
     <div class="section-title"><div><div class="kicker">PROJECT TEAM</div><strong>${members.length} active / approved</strong></div></div>
     ${members.length?members.map(memberCard).join(""):'<div class="empty">No active team members yet.</div>'}
   </article>`;
 }).join("");

 document.querySelectorAll("[data-member-action]").forEach(btn=>{
   btn.onclick=()=>updateMember(btn.dataset.memberAction,btn.dataset.id);
 });
}

function memberCard(m){
 const initials=(m.full_name||"Y").split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join("").toUpperCase();
 return `<div class="member">
   <div class="member-main"><div class="avatar">${esc(initials)}</div><div><div class="member-name">${esc(m.full_name)}</div><div class="member-meta">${esc(m.member_code)} · ${esc(m.email)}</div></div></div>
   <div class="actions"><span class="badge ${esc(m.status)}">${esc(m.status)}</span>
   <select data-role-select="${esc(m.membership_id)}">
     <option>Contributor</option><option>Researcher</option><option>Designer</option><option>AI Research</option><option>Electronics</option><option>Mission Design</option><option>Project Lead</option><option>Other</option>
   </select>
   ${m.status==="requested"?`<button class="btn primary" data-member-action="approve" data-id="${esc(m.membership_id)}">Approve</button><button class="btn ghost" data-member-action="reject" data-id="${esc(m.membership_id)}">Reject</button>`:`<button class="btn ghost" data-member-action="leave" data-id="${esc(m.membership_id)}">Mark Left</button>`}
   </div>
 </div>`;
}

async function updateMember(action,membershipId){
 const select=document.querySelector(`[data-role-select="${CSS.escape(membershipId)}"]`);
 const role=select?.value||"Contributor";
 const status=action==="approve"?"active":action==="reject"?"rejected":"left";
 if(!confirm(`${action==="approve"?"Approve":action==="reject"?"Reject":"Mark as left"} this membership as "${role}"?`))return;
 const msg=document.getElementById("msg");msg.textContent="Saving…";msg.className="msg";
 const {error}=await supabase.rpc("lead_update_project_member",{p_membership_id:membershipId,p_status:status,p_role:role});
 if(error){msg.textContent=error.message||"Could not update membership.";msg.className="msg error";return}
 msg.textContent=action==="approve"?"Member approved.":action==="reject"?"Membership rejected.":"Member marked as left.";
 msg.className="msg success";
 await loadProjects();
}

supabase.auth.onAuthStateChange((_e,s)=>{if(s)load()});
load();
</script>
</body>
</html>
